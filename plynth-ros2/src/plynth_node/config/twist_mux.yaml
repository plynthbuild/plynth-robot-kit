# twist_mux with Plynth's hold as a lock (plynth_node): while /plynth/hold says true, or says nothing for 0.5 s (the
# node stopped, or lost its way), twist_mux passes none of the velocity inputs below the lock's priority: it sends
# nothing for them, so the base stops on its own command timeout (or at once with plynth_node's zero_twist). A software
# hold you install by choice, inside your robot and beneath its own safety layer: never a safety function. Put your own
# inputs here; keep a person's joystick above the lock's priority only if your safety case says so. A config of your
# own that locks on plynth/stop, the old name, still works: the node says both.
#   ros2 run twist_mux twist_mux --ros-args --params-file config/twist_mux.yaml -r cmd_vel_out:=cmd_vel
# "/**": whatever the robot's namespace (/robot1/twist_mux, as in a fleet), its topics resolving inside it.
/**:
  ros__parameters:
    # geometry_msgs/Twist in and out, as Nav2 on Jazzy sends by default and Humble's twist_mux only knows. Jazzy's
    # twist_mux defaults to TwistStamped: set true if your controller sends that (Nav2's enable_stamped_cmd_vel).
    use_stamped: false
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
    locks:
      plynth:
        topic: plynth/hold
        timeout: 0.5
        priority: 100
