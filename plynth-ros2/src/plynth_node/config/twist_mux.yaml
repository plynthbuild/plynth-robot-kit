# twist_mux with Plynth's hold as a lock (plynth_node): while /plynth/stop says true, or says nothing for 0.5 s (the node
# stopped, or lost its way), every velocity input below the lock's priority is held at zero. Put your own inputs here;
# keep a person's joystick above the lock's priority only if your safety case says so.
#   ros2 run twist_mux twist_mux --ros-args --params-file config/twist_mux.yaml -r cmd_vel_out:=cmd_vel
# "/**": whatever the robot's namespace (/robot1/twist_mux, as in a fleet), its topics resolving inside it.
/**:
  ros__parameters:
    # geometry_msgs/Twist in and out, as Nav2 on Jazzy sends by default and Humble's twist_mux only knows. Jazzy's
    # twist_mux defaults to TwistStamped: set true if your controller sends that (Nav2's enable_stamped_cmd_vel).
    use_stamped: false
    topics:
      navigation:
        topic: cmd_vel_nav
        timeout: 0.5
        priority: 10
    locks:
      plynth:
        topic: plynth/stop
        timeout: 0.5
        priority: 100
