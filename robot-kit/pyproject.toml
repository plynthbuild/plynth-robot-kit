[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plynth-robot-kit"
version = "0.6.0"
description = "The reference client and conformance check for Plynth's robot API"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[project.scripts]
plynth-hello = "plynth.hello:main"
plynth-conformance = "plynth.conformance:main"
plynth-grade = "plynth.grade:main"
plynth-ask = "plynth.ask:main"

[tool.setuptools]
packages = ["plynth"]
